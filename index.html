<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada surat untukmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3eefc;
  --ink: #2b1f4e;
  --soft: #6d6190;
  --accent: #e5407a;
  --on-accent: #ffffff;
  --card: #ffffff;
  --env-back: #e07a9d;
  --env-front: #f2a3bd;
  --env-flap: #ec92b0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1530; --ink: #f4eeff; --soft: #b3a6d6;
    --accent: #ff6b9f; --on-accent: #2b0f1d; --card: #2a2045;
    --env-back: #a8416a; --env-front: #c85a85; --env-flap: #b84d78;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* ===== AMPLOP ===== */
#intro { text-align: center; transition: opacity .5s, transform .5s; }
#intro.hilang { opacity: 0; transform: translateY(2rem) scale(.9); }
#intro p { color: var(--soft); margin: 1.6rem 0 0; }

.env {
  position: relative;
  width: min(80vw, 20rem);
  aspect-ratio: 3 / 2;
  background: var(--env-back);
  border: 0; padding: 0;
  border-radius: .6rem;
  cursor: pointer;
  perspective: 900px;
  display: block;
  margin: 0 auto;
}
.env:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }

.paper {
  position: absolute; left: 8%; right: 8%; top: 8%; height: 80%;
  background: var(--card);
  border-radius: .4rem;
  z-index: 1;
  transition: transform .7s cubic-bezier(.3,.8,.3,1);
  display: grid; place-items: center; font-size: 2rem;
}
.front {
  position: absolute; inset: 0; z-index: 2;
  background: var(--env-front);
  border-radius: .6rem;
  clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
}
.flap {
  position: absolute; left: 0; top: 0; width: 100%; height: 55%;
  background: var(--env-flap);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  z-index: 3;
  transition: transform .6s ease, z-index 0s .3s;
}
.seal {
  position: absolute; left: 50%; top: 44%; z-index: 4;
  transform: translate(-50%, -50%);
  font-size: 1.6rem;
  transition: opacity .3s;
}
.env.buka .flap { transform: rotateX(180deg); z-index: 0; }
.env.buka .seal { opacity: 0; }
.env.naik .paper { transform: translateY(-65%); }

/* ===== HALAMAN ===== */
main {
  display: none;
  width: min(92vw, 30rem);
  background: var(--card);
  border-radius: 1.5rem;
  padding: 2.25rem 1.75rem;
  text-align: center;
}
main.muncul { display: block; animation: muncul .6s ease-out; }
@keyframes muncul { from { opacity: 0; transform: translateY(1.5rem) scale(.96); } }

h1 { font-size: clamp(1.7rem, 6vw, 2.2rem); line-height: 1.15; margin: .2em 0 .5em; font-weight: 800; }
main p { color: var(--soft); line-height: 1.6; max-width: 36ch; margin: 0 auto 1.5rem; }
main #penutup { margin-bottom: .5rem; }
main #status { font-size: .9rem; margin-bottom: 0; }
.big { font-size: 3.2rem; line-height: 1; }
.row { display: flex; gap: 1rem; justify-content: center; align-items: center; min-height: 3.5rem; }

button.pil {
  font: inherit; font-weight: 700; border: 0; border-radius: 999px;
  padding: .85rem 1.6rem; cursor: pointer; transition: transform .15s;
}
button.pil:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#iya { background: var(--accent); color: var(--on-accent); }
#tidak { background: transparent; color: var(--soft); border: 2px solid var(--soft); }
#hasil { display: none; }

.heart { position: fixed; bottom: -2rem; pointer-events: none; animation: naik linear forwards; }
@keyframes naik { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .heart { display: none; } }
</style>
</head>
<body>

<!-- Amplop -->
<div id="intro">
  <button class="env" id="amplop" aria-label="Buka amplop">
    <div class="paper" aria-hidden="true">💌</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal" aria-hidden="true">💗</div>
  </button>
  <p>Ada surat untukmu. Ketuk amplopnya.</p>
</div>

<!-- Halaman setelah amplop dibuka -->
<main id="halaman">
  <section id="tanya">
    <div class="big" aria-hidden="true">💌</div>
    <h1 id="judul"></h1>
    <p id="pembuka"></p>
    <div class="row">
      <button class="pil" id="iya">Iya, boleh</button>
      <button class="pil" id="tidak">Tidak</button>
    </div>
  </section>
  <section id="hasil">
    <h1>Yeay, makasih banyak ya!</h1>
    <p id="penutup"></p>
    <p id="status"></p>
  </section>
</main>

<script>
// ====== UBAH BAGIAN INI ======
const CFG = {
  dia: "",       // nama dia (atau pakai ?to=Nama di URL)
  aku: "Aku",    // nama kamu (atau pakai ?from=Nama di URL)
  pembuka: "Aku cuma mau ngomong klo Aku udah suka sama kamu dari sejak lama, cuma dari dulu masih belum berani ngungkapin, dulu juga aku cuma sekedar mengagumi kamu. Boleh nggak?",

  penolakan: ["Yakin?", "Coba pikir lagi deh", "Sedih kalo ga pencet tombol iya", "Tombolnya capek lari-llarian terus", "Pilih yang satunya aja ya"],

  // Pengiriman otomatis jawaban "Iya": "callmebot" (WhatsApp) atau "telegram"
  kirimVia: "callmebot",
  callmebot: { nomor: "6285713091638", apikey: "ISI_APIKEY_CALLMEBOT" },   // nomor WA kamu, format 62812xxxx
  telegram: { token: "ISI_TOKEN_BOT", chatId: "ISI_CHAT_ID" }
};
// ==============================

const params = new URLSearchParams(location.search);
if (params.get("to")) CFG.dia = params.get("to");
if (params.get("from")) CFG.aku = params.get("from");

const $ = (id) => document.getElementById(id);
const iya = $("iya");
const tidak = $("tidak");
let jumlahKabur = 0;

$("judul").textContent = `Hallo ${CFG.dia}, Ada yang mau aku bilang.`;
$("pembuka").textContent = CFG.pembuka;
$("penutup").textContent = CFG.penutup;

// --- Buka amplop ---
const amplop = $("amplop");
let sudahBuka = false;
amplop.addEventListener("click", () => {
  if (sudahBuka) return;
  sudahBuka = true;
  amplop.classList.add("buka");                                   // tutup amplop terbuka
  setTimeout(() => amplop.classList.add("naik"), 600);            // surat naik keluar
  setTimeout(() => $("intro").classList.add("hilang"), 1500);     // amplop memudar
  setTimeout(() => {
    $("intro").style.display = "none";
    $("halaman").classList.add("muncul");                         // halaman tampil
  }, 2000);
});

// --- Kirim jawaban "Iya" otomatis ke pengirim ---
async function kirimJawaban() {
  const nama = CFG.dia ? `ini ${CFG.dia}. ` : "";
  const pesan = `Hai ${CFG.aku}, ${nama}Aku sudah baca suratmu, dan jawabanku: IYA 💗`;
  const t = encodeURIComponent(pesan);
  const status = $("status");
  try {
    if (CFG.kirimVia === "telegram") {
      const { token, chatId } = CFG.telegram;
      const r = await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${encodeURIComponent(chatId)}&text=${t}`);
      if (!r.ok) throw new Error("gagal");
    } else {
      const { nomor, apikey } = CFG.callmebot;
      await fetch(`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent("+" + nomor)}&text=${t}&apikey=${apikey}`, { mode: "no-cors" });
    }
    status.textContent = `Jawabanmu sudah dikabari ke ${CFG.aku} 💗`;
  } catch (err) {
    status.textContent = `Jawabanmu belum terkirim, coba kabari ${CFG.aku} langsung ya.`;
  }
}

// --- Tombol "Tidak" kabur ---
function kabur(e) {
  e.preventDefault();
  const idx = Math.min(jumlahKabur, CFG.penolakan.length - 1);
  tidak.textContent = CFG.penolakan[idx];
  jumlahKabur++;
  iya.style.transform = `scale(${Math.min(1 + jumlahKabur * 0.12, 1.8)})`;
  tidak.style.position = "fixed";
  const maxX = window.innerWidth - tidak.offsetWidth - 16;
  const maxY = window.innerHeight - tidak.offsetHeight - 16;
  tidak.style.left = Math.random() * maxX + 8 + "px";
  tidak.style.top = Math.random() * maxY + 8 + "px";
}
tidak.addEventListener("mouseenter", kabur);
tidak.addEventListener("touchstart", kabur, { passive: false });
tidak.addEventListener("click", kabur);

// --- Hujan hati ---
function hati() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = ["💖", "💗", "💕", "🌸"][Math.floor(Math.random() * 4)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 1 + Math.random() * 1.6 + "rem";
  h.style.animationDuration = 3 + Math.random() * 3 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6500);
}

// --- Klik "Iya": tampilkan hasil + kirim jawaban otomatis ---
iya.addEventListener("click", () => {
  $("tanya").style.display = "none";
  tidak.style.display = "none";
  $("hasil").style.display = "block";
  for (let i = 0; i < 40; i++) setTimeout(hati, i * 120);
  kirimJawaban();
});
</script>
</body>
</html>
